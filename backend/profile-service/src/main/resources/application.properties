spring.application.name=profile-service

# Server Configuration
server.port=8081

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/mockmule
spring.datasource.username=mockmule_user
spring.datasource.password=mockmule_local_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


file.storage.location=uploads/resumes
